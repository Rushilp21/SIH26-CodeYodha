services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bhumisetu-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhumisetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhumisetu}
      POSTGRES_DB: ${POSTGRES_DB:-bhumisetu}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bhumisetu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhumisetu} -d ${POSTGRES_DB:-bhumisetu}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bhumisetu-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: bhumisetu-api
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bhumisetu}:${POSTGRES_PASSWORD:-bhumisetu}@postgres:5432/${POSTGRES_DB:-bhumisetu}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  bhumisetu_pgdata:
